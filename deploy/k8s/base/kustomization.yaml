apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nglab

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: nglab
  app.kubernetes.io/managed-by: kustomize

images:
  - name: nglab/api
    newTag: latest
  - name: nglab/api-gpu
    newTag: latest
