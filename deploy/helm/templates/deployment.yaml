{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nglab.fullname" . }}-api
  labels:
    {{- include "nglab.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nglab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "nglab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "nglab.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: NGLAB_DB_HOST
              value: {{ include "nglab.postgresHost" . }}
            - name: NGLAB_DB_PORT
              value: "5432"
            - name: NGLAB_DB_NAME
              value: {{ .Values.postgresql.auth.database | default "nglab" }}
            - name: NGLAB_DB_USER
              value: {{ .Values.postgresql.auth.username | default "nglab" }}
            - name: NGLAB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nglab.fullname" . }}-secrets
                  key: postgres-password
            - name: NGLAB_REDIS_HOST
              value: {{ include "nglab.redisHost" . }}
            - name: NGLAB_REDIS_PORT
              value: "6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "nglab.jaegerEndpoint" . }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: cache
              mountPath: /app/.cache
            - name: prometheus-tmp
              mountPath: /tmp/prometheus
      volumes:
        - name: models
          {{- if .Values.modelStorage.local.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nglab.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: cache
          emptyDir: {}
        - name: prometheus-tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
---
{{- if .Values.apiGpu.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nglab.fullname" . }}-api-gpu
  labels:
    {{- include "nglab.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gpu
spec:
  replicas: {{ .Values.apiGpu.replicaCount }}
  selector:
    matchLabels:
      {{- include "nglab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-gpu
  template:
    metadata:
      labels:
        {{- include "nglab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-gpu
    spec:
      serviceAccountName: {{ include "nglab.serviceAccountName" . }}
      containers:
        - name: api-gpu
          image: "{{ .Values.apiGpu.image.repository }}:{{ .Values.apiGpu.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.apiGpu.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: NGLAB_DB_HOST
              value: {{ include "nglab.postgresHost" . }}
            - name: NGLAB_REDIS_HOST
              value: {{ include "nglab.redisHost" . }}
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.apiGpu.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          {{- if .Values.modelStorage.local.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nglab.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      {{- with .Values.apiGpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
