# run: conda env create --file environment.yml -y
# del: conda remove -n nglab --all -y
name: nglab
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
  - anaconda
dependencies:
  - ipykernel=6.25
  - matplotlib=3.7
  - numpy=1.24
  - numpy-base=1.24
  - pandas=2.0
  - python=3.11
  - pytorch=2.0
  - pytorch-lightning=2.0
  - requests=2.31
  - scipy=1.10
  - torchaudio=2.0
  - torchmetrics=0.11
  - torchvision=0.15
  - tqdm=4.65
  - wandb=0.15
  - yfinance=0.2
  - pip=23.3
  - pip:
    - tensorboard_logger==0.1
    - torch-tb-profiler==0.4.3