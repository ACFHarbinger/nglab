# Global exclusion for directories that should never be touched by quality checks
exclude: |
  (?x)^(
    build/|
    node_modules/|
    \.venv/|
    \.git/|
    \.github/
  )

repos:
  # Python: Ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        stages: [post-commit]
      - id: ruff-format
        types_or: [python, pyi]
        stages: [post-commit]

  # Python: Black for formatting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        types_or: [python, pyi]
        stages: [post-commit]
  # Python: Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --check-untyped-defs]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - torch
          - numpy
          - pydantic
        types: [python]
        stages: [post-commit]

  # Python: Security audit
  - repo: https://github.com/pypa/pip-audit
    rev: v2.8.0
    hooks:
      - id: pip-audit
        args: ["--local"]
        files: ^python/.*$
        stages: [post-commit]

  # Rust: Formatting and Linting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code with rustfmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
        stages: [post-commit]
      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code with clippy
        entry: cargo clippy --all-features --workspace -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [post-commit]

  # TypeScript/JavaScript: Prettier for formatting
  # Strictly restricted to TS/JS to avoid touching MD, JSON, YAML, etc.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, jsx]
        exclude: '^(package-lock\.json|.*\.lock)$'
        stages: [post-commit]

  # Kotlin: Formatting with Gradle/ktlint
  - repo: local
    hooks:
      - id: ktlint-format
        name: ktlint format
        description: Format Kotlin code with ktlint via Gradle
        entry: ./gradlew :android:ktlintFormat
        language: system
        files: ^android/.*$
        pass_filenames: false
        stages: [post-commit]

  # General: Trailing whitespace and EOF fixes
  # Strictly restricted to core language files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types_or: [python, pyi, rust, ts, tsx, javascript, jsx, kotlin]
        stages: [post-commit]
      - id: end-of-file-fixer
        types_or: [python, pyi, rust, ts, tsx, javascript, jsx, kotlin]
        stages: [post-commit]
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [post-commit]
      - id: check-merge-conflict
        stages: [post-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        types_or: [python, pyi, rust, ts, tsx, javascript, jsx, kotlin]
        stages: [post-commit]
      - id: check-yaml
        args: [--unsafe]
        files: ^\.github/.*$ # Only check GitHub workflow YAMLs if needed
        stages: [post-commit]
      - id: check-toml
        files: ^(pyproject\.toml|Cargo\.toml)$
        stages: [post-commit]
      - id: check-json
        files: ^(package\.json|tsconfig\.json)$
        stages: [post-commit]
