version: '3.8'

services:
  nglab-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NGLAB_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    restart: unless-stopped

  # Optional: Monitoring services as suggested in IMPROVEMENTS.md
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
