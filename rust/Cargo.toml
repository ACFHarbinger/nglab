[package]
name = "nglab"
version = "0.1.0"
edition = "2021"
description = "A Multimodal Deep Reinforcement Learning bot to assist you in all your gambling (stock market) needs"
license = "AGPL-3.0-only"
repository = "https://github.com/ACFHarbinger/nglab"
documentation = "https://docs.rs/my_project"

[lib]
name = "nglab"
crate-type = ["cdylib", "rlib"]
# path defaults to src/lib.rs

[[bin]]
name = "nglab-cli"
path = "src/main.rs"
required-features = ["tui"]

[dependencies]
# Python bindings
pyo3 = { version = "0.27", optional = true }
numpy = { version = "0.27", optional = true }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
serde_json = "1.0"
url = "2.5"

# Data structures
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }

csv = "1.3"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"] }

# Collections
indexmap = { version = "2.7", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
config = "0.14"
thiserror = "2.0"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
rerun = { version = "0.28.2", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
color-eyre = { version = "0.6", optional = true }
rand_distr = "0.5"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

# Authentication
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.6", features = ["rand_core"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
zeroize = { version = "1.8", features = ["derive"] }
prometheus = "0.13"
once_cell = "1.20"
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["tonic", "tokio"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = "0.32"
sysinfo = "0.39"
async-trait = "0.1.89"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[features]
extension-module = ["pyo3/extension-module"]
python = ["dep:pyo3", "dep:numpy"]
tui = ["dep:ratatui", "dep:crossterm", "dep:color-eyre", "logging"]
logging = ["dep:rerun"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "arena_bench"
harness = false
path = "benchmarks/arena_bench.rs"

[[bench]]
name = "orderbook_bench"
harness = false
path = "benchmarks/orderbook_bench.rs"

[[bench]]
name = "trading_env_bench"
harness = false
path = "benchmarks/trading_env_bench.rs"
