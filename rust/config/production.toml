[environment]
name = "production"
log_level = "info"
debug = false

[rust]
arena_tick_rate_ms = 100
max_order_book_depth = 10000
enable_metrics = true

[python]
model_checkpoint_dir = "/var/lib/nglab/models"
wandb_mode = "online"
device = "cuda"

[tauri]
window_width = 1280
window_height = 720
enable_devtools = false

[database]
url = "${DATABASE_URL}"
pool_size = 20

[api]
polymarket_api_key = "${POLYMARKET_API_KEY}"
rate_limit_per_minute = 300
