[package]
name = "nglab"
version = "0.1.0"
edition = "2021"
description = "A Multimodal Deep Reinforcement Learning bot to assist you in all your gambling (stock market) needs"
repository = "https://github.com/ACFHarbinger/nglab"
documentation = "https://docs.rs/my_project"

[lib]
name = "nglab"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[[bin]]
name = "nglab-cli"
path = "rust/src/main.rs"
required-features = ["tui"]

[dependencies]
# Python bindings
pyo3 = { version = "0.22", optional = true }
numpy = { version = "0.22", optional = true }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Data structures
ndarray = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Collections
indexmap = { version = "2.7", features = ["serde"] }

# Utilities
thiserror = "2.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rerun = { version = "0.28.1", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
color-eyre = { version = "0.6", optional = true }

[features]
extension-module = ["pyo3/extension-module"]
python = ["dep:pyo3", "dep:numpy"]
tui = ["dep:ratatui", "dep:crossterm", "dep:color-eyre", "logging"]
logging = ["dep:rerun"]

[dev-dependencies]
criterion = "0.5"
