[package]
name = "nglab"
version = "0.1.0"
edition = "2021"
description = "A Multimodal Deep Reinforcement Learning bot to assist you in all your gambling (stock market) needs"
repository = "https://github.com/ACFHarbinger/nglab"
documentation = "https://docs.rs/my_project"

[lib]
name = "nglab"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[[bin]]
name = "nglab-cli"
path = "rust/src/main.rs"

[dependencies]
# Python bindings
pyo3 = { version = "0.22", optional = true }
numpy = { version = "0.22", optional = true }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Data structures
ndarray = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Collections
indexmap = { version = "2.7", features = ["serde"] }

# Utilities
thiserror = "2.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rerun = "0.28.1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
color-eyre = "0.6"

[features]
extension-module = ["pyo3/extension-module"]
python = ["dep:pyo3", "dep:numpy"]

[dev-dependencies]
criterion = "0.5"
