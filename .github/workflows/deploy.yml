name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  # We will define the lowercase IMAGE_NAME dynamically in the jobs

jobs:
  # ==========================================================================
  # We split the builds into separate jobs to maximize available disk space
  # ==========================================================================
  build-amd64:
    name: Build API (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CRITICAL: Convert repository name to lowercase to satisfy Docker requirements
      - name: Prepare Image Name
        id: prep
        run: |
          echo "image_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    name: Build API (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CRITICAL: Convert repository name to lowercase
      - name: Prepare Image Name
        id: prep
        run: |
          echo "image_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # This job merges the two architecture-specific images into a single manifest
  create-manifest:
    name: Create Multi-Arch Manifest
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # CRITICAL: Convert repository name to lowercase
      - name: Prepare Image Name
        id: prep
        run: |
          echo "image_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest \
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.image_name }}:latest-arm64

  deploy-production:
    name: Deploy to Production
    needs: create-manifest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config
      - name: Deploy with Helm
        run: |
          # Ensure we use lowercase here as well
          IMAGE_NAME_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          helm upgrade --install nglab-prod ./deploy/helm/nglab \
            --namespace nglab-prod --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/$IMAGE_NAME_LC \
            --set image.tag=latest \
            --values ./deploy/helm/nglab/values.yaml \
            --wait --timeout=10m