name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --dev

      - name: Format check with Black
        run: uv run black --check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with MyPy
        run: uv run mypy .

      - name: Security audit with pip-audit
        run: uv run pip-audit --local

      - name: Run Tests with Coverage
        run: uv run pytest --cov=python/src --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo Check
        run: cd rust && cargo check --all-features

      - name: Cargo Clippy
        run: cd rust && cargo clippy --all-features --workspace -- -D warnings

      - name: Cargo Test
        run: cd rust && cargo test --all-features

  typescript-ci:
    name: TypeScript CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          # FIXED: Pointing to root where package-lock.json actually resides
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test