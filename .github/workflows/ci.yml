name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Python Coverage ---
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run Python Tests with Coverage
        run: uv run pytest --cov=python/src --cov-report=xml

      # --- Rust Coverage ---
      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run Rust Tests with Coverage
        run: cargo tarpaulin --out Xml

      # --- TypeScript Coverage ---
      - name: Install Node Dependencies
        run: cd typescript && npm install
      - name: Run Vitest Coverage
        run: cd typescript && npm run test -- --coverage

      # --- Upload to Codecov ---
      - name: Upload Coverage Results
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: ./coverage.xml,./cobertura.xml,./typescript/coverage/clover.xml

  python-ci:
    name: Python CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint and Type Check
        run: |
          uv run black --check .
          uv run ruff check .
          uv run mypy .

      - name: Run Tests
        run: uv run pytest python/tests

  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: Cargo Check & Clippy
        run: |
          cd rust
          cargo check --all-features
          cargo clippy --all-features --workspace -- -D warnings

      - name: Cargo Test
        run: cd rust && cargo test --all-features

  typescript-ci:
    name: TypeScript CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./typescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          # FIXED: Pointing to root where package-lock.json actually resides
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test