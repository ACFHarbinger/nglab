# Cargo Build Configuration for NGLab
# This file optimizes build times and caching for development and CI/CD

[build]
# Enable incremental compilation for faster rebuilds
incremental = true

# Use sccache for distributed caching (optional, requires sccache installation)
# Uncomment the line below after installing: cargo install sccache
# rustc-wrapper = "sccache"

# Number of parallel jobs (default: # of CPUs)
# jobs = 4

[target.x86_64-unknown-linux-gnu]
# Linux-specific optimizations
linker = "gcc"
rustflags = ["-C", "link-arg=-fuse-ld=bfd"]

[target.x86_64-apple-darwin]
# macOS-specific optimizations
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-msvc]
# Windows-specific optimizations
rustflags = ["-C", "target-feature=+crt-static"]

# Development profile - fast compilation, basic optimization
[profile.dev]
opt-level = 0          # No optimization for faster compile times
debug = true           # Include debug symbols
incremental = true     # Enable incremental compilation
split-debuginfo = "unpacked"  # Faster on macOS

# Optimize dependencies even in dev mode for better runtime performance
[profile.dev.package."*"]
opt-level = 1          # Basic optimization for dependencies
debug = false          # No debug symbols for dependencies

# Release profile - maximum performance
[profile.release]
opt-level = 3          # Maximum optimization
lto = "fat"            # Link-time optimization (slower build, faster runtime)
codegen-units = 1      # Better optimization, slower compile
strip = true           # Strip symbols to reduce binary size
panic = "abort"        # Smaller binary, no unwinding
incremental = false    # Disable incremental for releases

# Release with debug info (for profiling)
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Benchmark profile
[profile.bench]
inherits = "release"
lto = "thin"           # Lighter LTO for faster builds

# Test profile - balance between speed and debuggability
[profile.test]
opt-level = 1          # Some optimization for faster tests
incremental = true
debug = true

# Registry configuration
[registries.crates-io]
protocol = "sparse"    # Use sparse registry for faster updates

# Net configuration
[net]
git-fetch-with-cli = false  # Use libgit2 for faster fetches

# Term configuration
[term]
verbose = false        # Reduce build output noise
color = "auto"         # Colored output when supported
