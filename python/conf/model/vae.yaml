# VAE Model Configuration

# Architecture
input_dim: 5  # Number of input features (e.g., OHLCV)
latent_dim: 32  # Dimensionality of latent space
d_model: 128  # Hidden dimension for backbones
seq_len: 100  # Input sequence length
pred_len: 20  # Prediction/reconstruction length

# Backbone configuration
encoder_type: mamba  # Options: transformer, mamba, lstm, gru, xlstm
decoder_type: null  # If null, uses same as encoder
n_layers: 3
n_heads: 8  # For transformer
d_ff: 512  # For transformer
dropout: 0.1
activation: gelu

# Training configuration
learning_rate: 0.001
weight_decay: 0.00001
kl_weight: 1.0  # Beta parameter for beta-VAE
kl_anneal_epochs: 10  # Number of epochs for KL annealing (0 = no annealing)
reconstruction_loss: mse  # Options: mse, l1, huber

# Validation
num_val_samples: 8  # Number of samples to generate during validation

# Optional: Additional backbone-specific kwargs
encoder_kwargs: {}
decoder_kwargs: {}
