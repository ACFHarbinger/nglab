# Data configuration
data_path: "data/polymarket/"
format: "csv"  # csv, parquet, hdf5
target_column: "price"
batch_size: 32
seq_len: 30
pred_len: 1
num_workers: 4

# Train/Val/Test split ratios (must sum to 1.0)
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15

# Preprocessing
normalize: "minmax"  # minmax, zscore, or null
add_technical_indicators: false

# Performance
streaming: false  # Use streaming for large datasets
pin_memory: true
