apiVersion: v2
name: nglab
description: NGLab - Multimodal Deep Reinforcement Learning Trading Bot
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - trading
  - machine-learning
  - reinforcement-learning
  - finance
home: https://github.com/your-org/nglab
sources:
  - https://github.com/your-org/nglab
maintainers:
  - name: NGLab Team
    email: team@nglab.example.com
dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: prometheus
    version: "25.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: "7.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
