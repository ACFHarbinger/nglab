apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nglab-ingress
spec:
  tls:
    - hosts:
        - dev.nglab.example.com
      secretName: nglab-tls-dev
  rules:
    - host: dev.nglab.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nglab-api-service
                port:
                  number: 80
