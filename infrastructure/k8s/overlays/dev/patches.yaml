apiVersion: apps/v1
kind: Deployment
metadata:
  name: nglab-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nglab-api-gpu
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api-gpu
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "1000m"
              memory: "4Gi"
              nvidia.com/gpu: "1"
