apiVersion: v1
kind: ServiceAccount
metadata:
  name: nglab-api
  namespace: nglab
  labels:
    app.kubernetes.io/name: nglab
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nglab-api-role
  namespace: nglab
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nglab-api-rolebinding
  namespace: nglab
subjects:
  - kind: ServiceAccount
    name: nglab-api
    namespace: nglab
roleRef:
  kind: Role
  name: nglab-api-role
  apiGroup: rbac.authorization.k8s.io
