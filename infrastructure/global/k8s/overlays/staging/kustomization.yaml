apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: nglab-staging

patches:
  - path: patches.yaml
    target:
      kind: Deployment
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: nglab-ingress

images:
  - name: nglab/api
    newTag: staging-latest
  - name: nglab/api-gpu
    newTag: staging-latest
