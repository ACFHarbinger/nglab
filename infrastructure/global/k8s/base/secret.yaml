apiVersion: v1
kind: Secret
metadata:
  name: nglab-secrets
  namespace: nglab
  labels:
    app.kubernetes.io/name: nglab
    app.kubernetes.io/component: secrets
type: Opaque
# Values should be base64 encoded
# Use: echo -n 'value' | base64
stringData:
  # Database credentials (override in overlay or use external secrets)
  POSTGRES_PASSWORD: "REPLACE_IN_OVERLAY"
  NGLAB_DB_USER: "nglab"
  # Redis password (if enabled)
  REDIS_PASSWORD: ""
  # AWS credentials for S3 model storage
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  # GCP credentials (mount as file instead)
  # Grafana
  GRAFANA_PASSWORD: "REPLACE_IN_OVERLAY"
