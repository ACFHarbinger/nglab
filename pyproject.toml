[project]
name = "nglab"
version = "0.1.0"
description = "A Multimodal Deep Reinforcement Learning bot to assist you in all your gambling (stock market) needs"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "gymnasium>=1.2.3",
    "hydra-core>=1.3.2",
    "loss-landscapes>=3.0.6",
    "matplotlib==3.7",
    "numpy==1.24",
    "optuna>=4.6.0",
    "pandas==2.0",
    "pytorch-lightning==2.0",
    "requests==2.31",
    "rich>=14.2.0",
    "scikit-learn>=1.3.0",
    "scipy==1.10",
    "stable-baselines3>=2.5.0",
    "tensorboard-logger==0.1",
    "tensordict>=0.10.0",
    "torch>=2.3",
    "torch-geometric>=2.7.0",
    "torchmetrics>=1.0",
    "torchrl>=0.10.1",
    "tqdm==4.65",
    "wandb==0.15",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14.0",
    "umap-learn>=0.5.4",
    "keyring>=24.2.0",
    "flask>=3.0.0",
    "psutil>=5.9.0",
    "mlflow>=2.7.0",
    "ray[default]>=2.7.0",
    "seaborn>=0.12.0",
    "deap>=1.4.1",
    "configspace>=0.7.1",
    "loguru>=0.7.2",
    "transformers>=4.34.0",
    "feedparser>=6.0.10",
    "redis>=5.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "asyncpg>=0.28.0",
    "boto3>=1.28.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-storage-control>=0.1.0",
    "distributed>=2026.1.1",
    "shap>=0.49.1",
]

[dependency-groups]
dev = [
    "maturin>=1.10.2",
    "black>=25.12.0",
    "hypothesis>=6.150.2",
    "ipykernel==6.25",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "secretstorage>=3.5.0",
    "sphinx>=9.0.4",
    "deptry>=0.12.0",
    "google>=3.0.0",
    "types-requests>=2.32.4.20260107",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python", "extension-module"]
module-name = "nglab._nglab"
bindings = "pyo3"
manifest-path = "rust/Cargo.toml"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["python", "environment", "nglab"]
extraPaths = ["typings"]
reportMissingImports = true
reportUnusedImport = "warning"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false

# Create an override for __init__.py files
ignore = ["**/__init__.py"]

[tool.mutmut]
paths_to_mutate = "python/src/"
runner = "python -m pytest"
tests_dir = "python/tests/"

[project.optional-dependencies]
cloud = [
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    "zstandard>=0.22.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
# Synchronized excludes with Ruff
extend-exclude = '''
/(
    typescript
  | rust
  | android
  | build
  | dist
  | node_modules
  | \.venv
  | \.git
  | \.mypy_cache
  | typings
)/
'''

[tool.ruff]
# Core alignment with Black
line-length = 88
target-version = "py311"
src = ["python/src"]

# Ensure Ruff targets the same files as Black
include = ["*.py", "*.pyi"]
exclude = [
    "typescript",
    "rust",
    "android",
    "build",
    "dist",
    "node_modules",
    ".venv",
    ".git",
    "typings",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",    # Line length (handled by formatter)
    "N806",    # Allow uppercase variables (X, Y matrices in ML)
    "PLR2004", # Allow magic values (common in OR/Optimization constants)
    "PLC0415", # Allow function-level imports (necessary for conditional CUDA imports)
    "PLR0912", # Allow many branches (complex RL environments)
    "COM812",  # Conflict with formatter
    "ISC001",  # Conflict with formatter
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["python", "nglab"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Strictly match Black's stable formatting
quote-style = "double"
indent-style = "space"
# Setting skip-magic-trailing-comma to false aligns with Black's behavior
skip-magic-trailing-comma = false
line-ending = "auto"
# Black doesn't format code in docstrings by default, so we disable it here to stop the conflict
docstring-code-format = false

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["python/src/"]
exclude = ["python/examples/", "python/tests/", "python/scripts/", "python/docs/"]

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "nglab.*",
    "torch.*",
    "tensordict.*",
    "torchrl.*",
    "pytorch_lightning.*",
    "hydra.*",
    "omegaconf.*",
    "numpy.*",
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "statsmodels.*",
    "umap.*",
    "flask.*",
    "psutil.*",
    "tqdm.*",
    "rich.*",
    "wandb.*",
    "xgboost.*",
    "lightgbm.*",
    "mlflow",
    "mlflow.*",
    "ray.*",
    "optuna.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

# Fixes the DEP002 errors you saw in deptry by correctly mapping imports to packages
[tool.deptry.package_module_name_map]
hydra-core = "hydra"
scikit-learn = "sklearn"
umap-learn = "umap"
pytorch-lightning = "pytorch_lightning"
opentelemetry-api = "opentelemetry"
opentelemetry-sdk = "opentelemetry"
google-cloud-storage = "google.cloud.storage"

# Ignore specific development/build tools from code-usage scans
[tool.deptry]
ignore_unused = ["maturin", "rich", "tensorboard-logger", "keyring"]

# =================================================================
# PYTEST CONFIGURATION (from pytest.ini)
# =================================================================

[tool.pytest.ini_options]
# Test discovery
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*", "*_test"]
testpaths = "python/tests" # Original pyproject.toml value

# Console output options (addopts converted to list format)
addopts = [
    "-v",               # Verbose output
    "-ra",              # Show summary of all test outcomes
    "--showlocals",     # Show local variables in tracebacks
    "--strict-markers", # Fail on unknown markers
    #"--strict-config",  # Fail on unknown config options
    "--tb=short",       # Shorter traceback format
    "--color=yes",      # Color output
    "--show-capture=all", # Show captured output on failure
    "--disable-warnings", # Disable warnings to reduce noise
]

# Markers for categorizing tests (converted to key=value pairs)
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast running",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "validation: marks tests that validate argument combinations",
    "edge_case: marks tests for edge cases",
    "parametrize: marks parametrized tests",
    "train_rl: marks tests related to reinforcement learning training",
    "mrl_train: marks tests related to meta-learning training",
    "train_sl: marks tests related to supervised learning training",
    "train_ul: marks tests related to unsupervised learning training",
    "train_semi: marks tests related to semi-supervised learning training",
    "train_self: marks tests related to self-supervised learning training",
    "hp_optim: marks tests related to hyperparameter optimization",
    "eval: marks tests related to evaluation command",
    "architecture: marks tests related to deep learning architectures",
    "integration: marks integration tests",
    "policies: marks tests for simulation policies",
    "model: marks tests for classical machine learning models",
    "data: marks tests for data processing",
    "gpu: marks tests requiring GPU/CUDA",
    "skip: skip this test",
    "skipif: skip this test if condition is true",
    "xfail: expected to fail",
]

# Filter warnings (converted to list)
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore:.*urllib3.*:UserWarning",
    "ignore:.*distutils.*:DeprecationWarning",
    "error::ResourceWarning",
]

# Logging configuration
log_level = "INFO"
log_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# JUnit XML output
junit_suite_name = "wsmart_route"
junit_logging = "all"
junit_duration_report = "call"

# =================================================================
# COVERAGE CONFIGURATION (from [tool:coverage] and [coverage:*])
# =================================================================
[tool.coverage.run]
source = [
    "."
]
omit = [
    "*/test/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.*/*",
    "setup.py",
    "conftest.py",
]
branch = true
data_file = ".coverage"

[tool.coverage.report]
fail_under = 60
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
    "logger\\.",
    "log\\.",
    "pass",
    "from typing import",
    "import typing",
]

[tool.coverage.html]
directory = "htmlcov"
title = "nglab Test Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
