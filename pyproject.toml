[project]
name = "nglab"
version = "0.1.0"
description = "A Multimodal Deep Reinforcement Learning bot to assist you in all your gambling (stock market) needs. Application-level Python dependencies now live in the python/ (machine-learning-zoo) workspace member rather than here — see python/pyproject.toml."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11, <3.13"
dependencies = []

[tool.uv.workspace]
members = ["python"]

[dependency-groups]
# maturin stays here (it drives THIS project's own Rust/pyo3 build); every
# other dev tool moved to python/pyproject.toml's dev group.
dev = [
    "maturin>=1.10.2",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python", "extension-module"]
module-name = "nglab._nglab"
bindings = "pyo3"
manifest-path = "rust/Cargo.toml"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["python", "nglab"]
extraPaths = ["typings"]
reportMissingImports = true
reportUnusedImport = "warning"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false

# Create an override for __init__.py files
ignore = ["**/__init__.py"]

[tool.mutmut]
paths_to_mutate = "python/src/"
runner = "python -m pytest"
tests_dir = "python/tests/"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
# Synchronized excludes with Ruff
extend-exclude = '''
/(
    typescript
  | rust
  | android
  | build
  | dist
  | node_modules
  | \.venv
  | \.git
  | \.mypy_cache
  | typings
)/
'''

[tool.ruff]
# Core alignment with Black
line-length = 88
target-version = "py311"
src = ["python/src"]

# Ensure Ruff targets the same files as Black
include = ["*.py", "*.pyi"]
exclude = [
    "typescript",
    "rust",
    "android",
    "build",
    "dist",
    "node_modules",
    ".venv",
    ".git",
    "typings",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "B",   # flake8-bugbear
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",    # Line length (handled by formatter)
    "N806",    # Allow uppercase variables (X, Y matrices in ML)
    "PLR2004", # Allow magic values (common in OR/Optimization constants)
    "PLC0415", # Allow function-level imports (necessary for conditional CUDA imports)
    "PLR0912", # Allow many branches (complex RL environments)
    "COM812",  # Conflict with formatter
    "ISC001",  # Conflict with formatter
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["python", "nglab"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
# Strictly match Black's stable formatting
quote-style = "double"
indent-style = "space"
# Setting skip-magic-trailing-comma to false aligns with Black's behavior
skip-magic-trailing-comma = false
line-ending = "auto"
# Black doesn't format code in docstrings by default, so we disable it here to stop the conflict
docstring-code-format = false

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["python/src/"]
exclude = [
    "python/examples/",
    "python/tests/",
    "python/scripts/",
    "python/docs/",
]

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "nglab.*",
    "torch.*",
    "tensordict.*",
    "torchrl.*",
    "pytorch_lightning.*",
    "hydra.*",
    "omegaconf.*",
    "numpy.*",
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "statsmodels.*",
    "umap.*",
    "flask.*",
    "psutil.*",
    "tqdm.*",
    "rich.*",
    "wandb.*",
    "xgboost.*",
    "lightgbm.*",
    "mlflow",
    "mlflow.*",
    "ray.*",
    "optuna.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

# Fixes the DEP002 errors you saw in deptry by correctly mapping imports to packages
[tool.deptry.package_module_name_map]
hydra-core = "hydra"
scikit-learn = "sklearn"
umap-learn = "umap"
pytorch-lightning = "pytorch_lightning"
opentelemetry-api = "opentelemetry"
opentelemetry-sdk = "opentelemetry"
google-cloud-storage = "google.cloud.storage"

# Ignore specific development/build tools from code-usage scans
[tool.deptry]
ignore_unused = ["maturin", "rich", "tensorboard-logger", "keyring"]


# =================================================================
# COVERAGE CONFIGURATION (from [tool:coverage] and [coverage:*])
# =================================================================
[tool.coverage.run]
source = ["."]
omit = [
    "*/test/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.*/*",
    "setup.py",
    "conftest.py",
]
branch = true
data_file = ".coverage"

[tool.coverage.report]
fail_under = 60
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
    "logger\\.",
    "log\\.",
    "pass",
    "from typing import",
    "import typing",
]

[tool.coverage.html]
directory = "htmlcov"
title = "nglab Test Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
