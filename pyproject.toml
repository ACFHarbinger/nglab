[project]
name = "nglab"
version = "0.1.0"
description = "A Multimodal Deep Reinforcement Learning bot to assist you in all your gambling (stock market) needs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.2.3",
    "ipykernel==6.25",
    "matplotlib==3.7",
    "maturin>=1.10.2",
    "numpy==1.24",
    "pandas==2.0",
    "pip==23.3",
    "pytorch-lightning==2.0",
    "requests==2.31",
    "scipy==1.10",
    "tensorboard-logger==0.1",
    "torch==2.0",
    "torch-tb-profiler==0.4.3",
    "torchmetrics==0.11",
    "tqdm==4.65",
    "wandb==0.15",
    "yfinance==0.2.66",
]
