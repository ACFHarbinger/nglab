[project]
name = "nglab"
version = "0.1.0"
description = "A Multimodal Deep Reinforcement Learning bot to assist you in all your gambling (stock market) needs"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "gymnasium>=1.2.3",
    "hydra-core>=1.3.2",
    "ipykernel==6.25",
    "loss-landscapes>=3.0.6",
    "matplotlib==3.7",
    "maturin>=1.10.2",
    "numpy==1.24",
    "optuna>=4.6.0",
    "pandas==2.0",
    "pip==23.3",
    "pytorch-lightning==2.0",
    "requests==2.31",
    "rich>=14.2.0",
    "scikit-learn>=1.3.0",
    "scipy==1.10",
    "stable-baselines3>=2.5.0",
    "tensorboard-logger==0.1",
    "tensordict>=0.10.0",
    "torch>=2.3",
    "torch-geometric>=2.7.0",
    "torch-tb-profiler<=0.4.3",
    "torchmetrics>=1.0",
    "torchrl>=0.10.1",
    "tqdm==4.65",
    "wandb==0.15",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "yfinance==0.2.66",
    "statsmodels>=0.14.6",
    "umap-learn>=0.5.11",
    "keyring>=25.7.0",
    "flask>=3.0.0",
    "psutil>=5.9.0",
    "mlflow>=2.10.2",
    "ray>=2.53.0",
    "seaborn>=0.12.1",
    "deap>=1.4.3",
    "configspace>=1.2.2",
    "loguru>=0.7.3",
    "distributed>=2026.1.1",
    "transformers>=4.57.6",
    "feedparser>=6.0.12",
    "redis>=7.1.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "asyncpg>=0.31.0",
    "boto3>=1.42.30",
    "google>=3.0.0",
    "google-cloud-storage>=3.8.0",
    "google-cloud-storage-control>=1.9.0",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python", "extension-module"]
module-name = "nglab._nglab"
bindings = "pyo3"
manifest-path = "rust/Cargo.toml"

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["python", "environment", "nglab"]
extraPaths = ["typings"]
reportUnusedImport = "warning"
reportMissingTypeStubs = "warning"

# Create an override for __init__.py files
ignore = ["**/__init__.py"]

[tool.mutmut]
paths_to_mutate = "python/src/"
runner = "python -m pytest"
tests_dir = "python/tests/"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.1",
    "black>=25.12.0",
    "hypothesis>=6.150.2",
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "secretstorage>=3.5.0",
    "sphinx>=9.0.4",
]

[project.optional-dependencies]
cloud = [
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    "zstandard>=0.22.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["*.py", "*.pyi"]
extraPaths = ["./typings"]
exclude = ["typescript", "rust", "android", "build", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = ["E501"] # Line too long (handled by black)
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["python", "nglab"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "nglab.*",
    "torch.*",
    "tensordict.*",
    "torchrl.*",
    "pytorch_lightning.*",
    "hydra.*",
    "omegaconf.*",
    "numpy.*",
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "yfinance.*",
    "statsmodels.*",
    "umap.*",
    "flask.*",
    "psutil.*",
    "tqdm.*",
    "rich.*",
    "wandb.*",
    "xgboost.*",
    "lightgbm.*",
    "mlflow",
    "mlflow.*",
    "ray.*",
    "optuna.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

# =================================================================
# PYTEST CONFIGURATION (from pytest.ini)
# =================================================================

[tool.pytest.ini_options]
# Test discovery
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*", "*_test"]
testpaths = "python/tests" # Original pyproject.toml value

# Console output options (addopts converted to list format)
addopts = [
    "-v",               # Verbose output
    "-ra",              # Show summary of all test outcomes
    "--showlocals",     # Show local variables in tracebacks
    "--strict-markers", # Fail on unknown markers
    #"--strict-config",  # Fail on unknown config options
    "--tb=short",       # Shorter traceback format
    "--color=yes",      # Color output
    "--show-capture=all", # Show captured output on failure
    "--disable-warnings", # Disable warnings to reduce noise
]

# Markers for categorizing tests (converted to key=value pairs)
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast running",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "validation: marks tests that validate argument combinations",
    "edge_case: marks tests for edge cases",
    "parametrize: marks parametrized tests",
    "train_rl: marks tests related to reinforcement learning training",
    "mrl_train: marks tests related to meta-learning training",
    "train_sl: marks tests related to supervised learning training",
    "train_ul: marks tests related to unsupervised learning training",
    "train_semi: marks tests related to semi-supervised learning training",
    "train_self: marks tests related to self-supervised learning training",
    "hp_optim: marks tests related to hyperparameter optimization",
    "eval: marks tests related to evaluation command",
    "architecture: marks tests related to deep learning architectures",
    "integration: marks integration tests",
    "policies: marks tests for simulation policies",
    "model: marks tests for classical machine learning models",
    "data: marks tests for data processing",
    "gpu: marks tests requiring GPU/CUDA",
    "skip: skip this test",
    "skipif: skip this test if condition is true",
    "xfail: expected to fail",
]

# Filter warnings (converted to list)
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore:.*urllib3.*:UserWarning",
    "ignore:.*distutils.*:DeprecationWarning",
    "error::ResourceWarning",
]

# Logging configuration
log_level = "INFO"
log_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# JUnit XML output
junit_suite_name = "wsmart_route"
junit_logging = "all"
junit_duration_report = "call"

# =================================================================
# COVERAGE CONFIGURATION (from [tool:coverage] and [coverage:*])
# =================================================================
[tool.coverage.run]
source = [
    "."
]
omit = [
    "*/test/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.*/*",
    "setup.py",
    "conftest.py",
]
branch = true
data_file = ".coverage"

[tool.coverage.report]
fail_under = 60
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
    "logger\\.",
    "log\\.",
    "pass",
    "from typing import",
    "import typing",
]

[tool.coverage.html]
directory = "htmlcov"
title = "nglab Test Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
